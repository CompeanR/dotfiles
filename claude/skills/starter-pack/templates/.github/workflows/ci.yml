name: CI

on:
    push:
        branches:
            - {{DEFAULT_BRANCH}}
    pull_request:
        branches:
            - {{DEFAULT_BRANCH}}
        types:
            - opened
            - synchronize
            - reopened
            - labeled
            - unlabeled

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            {{SETUP_STEPS}}

            - name: Check
              run: make check

            - name: No stray whitespace or generated drift
              run: git diff --check && git diff --exit-code

    scope:
        name: PR scope
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            BASE_SHA: ${{ github.event.pull_request.base.sha }}
            BASE_REF: ${{ github.base_ref }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            HAS_SCOPE_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'scope-exception') }}
            HAS_ONE_WAY: ${{ contains(github.event.pull_request.labels.*.name, 'one-way') }}
            BODY: ${{ github.event.pull_request.body }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Commit messages
              run: |
                  git show "$BASE_SHA:.githooks/commit-msg" >"$RUNNER_TEMP/commit-msg" 2>/dev/null || cp .githooks/commit-msg "$RUNNER_TEMP/commit-msg"
                  for sha in $(git rev-list --reverse "$BASE_SHA..$HEAD_SHA"); do
                    git log -1 --format=%B "$sha" >"$RUNNER_TEMP/message"
                    sh "$RUNNER_TEMP/commit-msg" "$RUNNER_TEMP/message" || { echo "::error::Commit $sha does not follow docs/pull-requests.md."; exit 1; }
                  done

            - name: Count hand-written lines
              run: |
                  set -o pipefail
                  git show "$BASE_SHA:scripts/pr-brief.sh" >"$RUNNER_TEMP/pr-brief.sh" 2>/dev/null || cp scripts/pr-brief.sh "$RUNNER_TEMP/pr-brief.sh"
                  files=
                  if git show "origin/$BASE_REF:scripts/one-way.sh" >"$RUNNER_TEMP/one-way.sh" 2>/dev/null; then
                    files=$(git diff --name-only "origin/$BASE_REF...$HEAD_SHA" | bash "$RUNNER_TEMP/one-way.sh")
                  else
                    echo "No scripts/one-way.sh on $BASE_REF yet; the body and the reviewer name the door."
                  fi
                  one_way=false
                  if [ "$HAS_ONE_WAY" = "true" ] || [ -n "$files" ] || printf '%s' "$BODY" | grep -qiE '\*\*Door:\*\*[[:space:]]*one-way'; then
                    one_way=true
                  fi
                  gate=--gate
                  if [ "$one_way" = "false" ]; then
                    gate=
                    echo "Two-way PR: the size limit warns but does not fail; it merges after CI and the review loop."
                  elif [ "$HAS_SCOPE_EXCEPTION" = "true" ]; then
                    gate=
                    echo "scope-exception label present; the PR body must give the rationale."
                  fi
                  bash "$RUNNER_TEMP/pr-brief.sh" $gate "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

    door:
        name: Door
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: write
        env:
            BASE_REF: ${{ github.base_ref }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            PR: ${{ github.event.pull_request.number }}
            GH_TOKEN: ${{ github.token }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Label one-way files
              run: |
                  if ! git show "origin/$BASE_REF:scripts/one-way.sh" >"$RUNNER_TEMP/one-way.sh" 2>/dev/null; then
                    echo "No scripts/one-way.sh on $BASE_REF yet; the body and the reviewer name the door." | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  files=$(git diff --name-only "origin/$BASE_REF...$HEAD_SHA" | bash "$RUNNER_TEMP/one-way.sh")
                  if [ -z "$files" ]; then
                    echo "No one-way files; the body and the reviewer name the door." | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  { echo "One-way: the owner merges. Files:"; echo "$files" | sed 's/^/- /'; } | tee -a "$GITHUB_STEP_SUMMARY"
                  gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label one-way

# Start screensaver after 15 minutes. The screensaver resets Hypridle's
# idle timer, so the lock listener below fires after another 15 minutes.

general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    after_sleep_cmd = sleep 1 && omarchy-system-wake
    inhibit_sleep = 3
}

# Start screensaver after 15 minutes.
listener {
    timeout = 900
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock the system after about 30 minutes total (15 minutes + 15 minutes,
# with a two-second margin because launching the screensaver resets idle time).
listener {
    timeout = 902
    on-timeout = omarchy-system-lock
    on-resume = omarchy-system-wake
}

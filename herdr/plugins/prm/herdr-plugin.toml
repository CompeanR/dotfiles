id = "prm"
name = "PR control"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "alt+r: prm inside Neovim when Neovim is focused, otherwise prm in a popup."
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "PR control"
contexts = ["global"]
command = ["bash", "open.sh"]

[[panes]]
id = "tui"
title = "PR control"
placement = "popup"
width = "90%"
height = "90%"
command = ["zsh", "-lc", "prm"]
